<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanShare 在线演示 · 局域网文件共享</title>
<link rel="stylesheet" href="./style.css">

<style>
  /* ---- 演示环境专属样式（线上正式版没有这一块） ---- */
  .demo-bar {
    position: sticky; top: 0; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 9px 20px;
    background: linear-gradient(90deg, rgba(61,126,255,.16), rgba(61,126,255,.04));
    border-bottom: 1px solid #2a3448;
    backdrop-filter: blur(8px);
    font-size: 12.5px; color: #b9c6da;
  }
  .demo-bar b { color: #7fb0ff; font-weight: 600; }
  .demo-bar a {
    color: #7fb0ff; text-decoration: none; white-space: nowrap;
    border: 1px solid #2a3448; border-radius: 7px; padding: 4px 10px;
    transition: .16s;
  }
  .demo-bar a:hover { border-color: #3d7eff; background: rgba(61,126,255,.12); }
  .demo-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #2ecc71; margin-right: 6px;
    box-shadow: 0 0 0 3px rgba(46,204,113,.16);
  }
  @media (max-width: 620px) {
    .demo-bar { font-size: 11.5px; padding: 8px 14px; }
  }
</style>
</head>
<body>
<div class="demo-bar">
  <span><span class="demo-dot"></span><b>在线演示</b> · 所有操作真实有效，数据保存在你的浏览器里，不会上传到任何服务器</span>
  <a href="../">← 返回官网</a>
</div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📡</span>
      <div>
        <h1>局域网文件共享</h1>
        <p class="brand-sub" id="addrHint">正在获取地址…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="ro-badge" id="roBadge" hidden>只读模式</span>
      <button class="btn ghost" id="btnCopy">复制访问地址</button>
      <button class="btn ghost" id="btnRefresh">刷新</button>
      <button class="btn ghost" id="btnLogout">退出</button>
    </div>
  </header>

  <section class="toolbar">
    <div class="toolbar-left">
      <button class="btn primary" id="btnUpload">⬆ 上传文件</button>
      <button class="btn" id="btnFolder">📁 新建文件夹</button>
      <button class="btn" id="btnText">📝 新建文字</button>
    </div>
    <div class="toolbar-right">
      <input class="search" id="search" type="search" placeholder="搜索当前目录…">
    </div>
    <input type="file" id="fileInput" multiple hidden>
  </section>

  <nav class="crumbs" id="crumbs"></nav>

  <main class="panel">
    <div class="panel-head">
      <span id="countLabel">共 0 项</span>
      <span class="hint">支持把文件直接拖到这里上传</span>
    </div>
    <div class="list" id="list"></div>
    <div class="dropzone" id="dropzone">松开鼠标即可上传到当前目录</div>
  </main>

  <div class="upload-bar" id="uploadBar" hidden>
    <div class="upload-info" id="uploadInfo">准备上传…</div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <footer class="foot">
    <span id="sharedDir"></span>
  </footer>
</div>

<!-- 通用弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">标题</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- 编辑器 -->
<div class="modal" id="editor">
  <div class="modal-box wide">
    <h3 id="editorTitle">编辑</h3>
    <textarea id="editorArea" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="btn ghost" id="editorCancel">取消</button>
      <button class="btn primary" id="editorSave">保存</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="./mock-api.js"></script>
<script src="./app.js"></script>
</body>
</html>

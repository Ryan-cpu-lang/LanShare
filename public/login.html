<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-title" content="局域网共享">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
<title>请输入 PIN - 局域网文件共享</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-icon">🔒</div>
    <h1>需要 PIN 码</h1>
    <p class="login-sub">请输入访问密码后继续</p>

    <form id="loginForm" autocomplete="off">
      <input id="pin" class="pin-input" type="password" inputmode="numeric"
             placeholder="请输入 PIN" autocomplete="off" maxlength="64" required>
      <div class="login-msg" id="msg"></div>
      <button class="login-btn" type="submit" id="btnLogin">进入</button>
    </form>

    <p class="login-tip" id="tip"></p>
  </div>
</div>
<script src="/login.js"></script>
</body>
</html>
